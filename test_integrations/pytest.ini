[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --json-report
    --json-report-file=report.json
markers =
    integration: marks tests as integration with GIS Torgi
    slow: marks tests that may take longer
    schema: marks schema validation tests
env =
    GIS_TORGI_BASE_URL=https://torgi.gov.ru
    GIS_TORGI_AUTH_TOKEN=test_token